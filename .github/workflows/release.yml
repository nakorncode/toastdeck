name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release, for example v3.0.0-pre.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./native -> target"

      - name: Install NSIS and WiX
        shell: pwsh
        run: |
          choco install nsis wixtoolset -y --no-progress

      - name: Build NSIS and MSI installers
        shell: pwsh
        run: ./scripts/build-installers.ps1 -ProductVersion ("${{ steps.release_tag.outputs.tag }}".TrimStart("v"))

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ToastDesk v3 ${{ steps.release_tag.outputs.tag }}
          files: artifacts/release/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
          make_latest: false
